name: Scheduled Scraper

on:
  # Scheduling is handled externally (cron-job.org calling app/api/cron/trigger-scraper,
  # which fires this workflow_dispatch) rather than via GitHub's native `schedule` trigger,
  # which is best-effort and was frequently delayed or dropped by hours.
  workflow_dispatch:
    inputs:
      slot:
        description: >
          Optional label for which daily run this is. Set to '11am' only on the
          run that should also do the once-daily unlisted-returns check.
        required: false
        default: ''

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print current branch
        run: |
          echo "Current branch:" && git branch --show-current

      - name: List workspace contents
        run: |
          echo "Workspace root:" && ls -alh
          echo "App directory:" && ls -alh app || echo "app directory not found"

      - name: List workspace and app directory
        run: |
          echo "Workspace root:" && ls -alh
          echo "App directory:" && ls -alh app || echo "app directory not found"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx src/utils/run-scraper-pipeline.ts

      - name: Commit updated scraped IDs
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add public/latest_scraped_ids.json
          git diff --staged --quiet || git commit -m "Update latest_scraped_ids.json from scheduled scraper"
          git push

      - name: Upload scraped IDs JSON
        uses: actions/upload-artifact@v4
        with:
          name: latest_scraped_ids
          path: public/latest_scraped_ids.json

      - name: Check for unlisted returns (adopted dogs back at shelter but not re-listed)
        if: github.event.inputs.slot == '11am'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx src/utils/run-unlisted-returns-check.ts
